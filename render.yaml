# Render Blueprint for the Ramachandra Traders API.
#
# Deploy: Render Dashboard → New → Blueprint → select the My-Shop repo.
# Render reads this file from the repository root and creates the web service.
# Values marked `sync: false` are collected in the dashboard, so no secret is
# committed to git.
services:
  - type: web
    name: ramachandra-traders-api
    runtime: node
    # Free instances sleep after ~15 minutes of inactivity (first request then
    # takes ~50s). Use `starter` for a real shop.
    plan: free
    region: singapore
    rootDir: Website/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once and kept by Render. Rotating JWT_SECRET signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      # 32-byte base64 key used to encrypt refund account details.
      # Rotating it makes old refund records unreadable.
      - key: REFUND_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: EXPO_PUSH_ENABLED
        value: "false"
      - key: STORE_PINCODE
        value: "751001"
      - key: STORE_CITY
        value: Bhubaneswar
      - key: STORE_STATE
        value: Odisha

      # --- Required: fill these in the Render dashboard -------------------
      - key: MONGODB_URI
        sync: false
      # Comma-separated browser origins, e.g.
      # https://my-shop.vercel.app,https://www.my-shop.in
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # iOS/Android OAuth client ids (comma separated) for mobile sign-in.
      - key: GOOGLE_MOBILE_CLIENT_IDS
        sync: false
      # Public origin of this service, e.g. https://ramachandra-traders-api.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      # http(s) page opened after a mobile Razorpay payment link completes.
      - key: MOBILE_PAYMENT_RETURN_URL
        sync: false

      # --- Online payments (optional; COD works without these) -----------
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # --- Courier integration (optional) --------------------------------
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        sync: false
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP_LOCATION
        sync: false
      - key: DELHIVERY_CLIENT_NAME
        sync: false
      - key: DELHIVERY_WEBHOOK_TOKEN
        sync: false

      # --- Email notifications (optional) --------------------------------
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
